<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FenixCut — Editor de vídeo</title>
<meta name="theme-color" content="#1a1018">
<meta name="description" content="Editor de vídeo no telemóvel com legendas automáticas, edição por IA, efeitos e exportação até 4K.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Anton&family=Bebas+Neue&family=Bangers&family=Pacifico&family=Playfair+Display:wght@400;800&family=Special+Elite&family=Abril+Fatface&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" role="img" aria-label="FenixCut"><rect x="2" y="2" width="28" height="28" rx="7" stroke="currentColor" stroke-width="2.4"/><path d="M13 10.5v11l9-5.5z" fill="currentColor"/><path d="M2 21h5M25 21h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>FenixCut</span>
      </div>
      <div class="topr">
        <select id="ratio" aria-label="Formato do vídeo"><option value="9:16">9:16 Vertical</option><option value="16:9">16:9 Horizontal</option><option value="1:1">1:1 Quadrado</option><option value="4:5">4:5 Feed</option></select>
        <button class="btn" id="btnImport">Importar</button>
        <button class="btn primary" id="btnExport">Exportar</button>
      </div>
    </div>
    <div class="projbar">
      <button class="btn sm" id="btnProj">Projetos</button>
      <input id="projName" type="text" maxlength="60" aria-label="Nome do projeto" placeholder="Nome do projeto">
      <span id="saveState" class="save" aria-live="polite"></span>
      <button class="icon sm" id="panelSize" aria-label="Alterar tamanho do painel" title="Tamanho do painel"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg></button>
    </div>
  </header>
  <section class="stage">
    <div class="canvasWrap">
      <canvas id="preview" width="480" height="854"></canvas>
      <div id="empty"><p>Começa por importar um vídeo</p><button class="btn primary" id="emptyImport">Escolher vídeos</button></div>
    </div>
    <div class="transport">
      <button class="icon big" id="btnPlay" aria-label="Reproduzir ou pausar"></button>
      <input id="timeIn" class="timein" type="text" inputmode="decimal" value="0:00.000" aria-label="Tempo atual (escreve para ir para esse ponto)" title="Escreve o tempo (ex.: 1:23.450) e carrega Enter"><span id="timeTot" class="time">/ 0:00.000</span>
      <span class="sp"></span>
      <button class="icon" id="btnFocus" aria-label="Ampliar pré-visualização" title="Ampliar pré-visualização"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon" id="btnSplit" aria-label="Dividir clipe na agulha"></button>
      <button class="icon" id="btnDel" aria-label="Apagar seleção"></button>
      <button class="icon" id="btnUndo" aria-label="Desfazer"></button>
    </div>
  </section>
  <section class="tl" aria-label="Timeline">
    <div class="tlbar">
      <button class="icon" id="btnStart" aria-label="Ir para o início"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 5h2v14H5zM9 12l10-7v14z"/></svg></button>
      <button class="icon" id="btnPrevF" aria-label="Recuar 1 frame"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15 6v12L7 12z"/></svg></button>
      <button class="icon" id="btnNextF" aria-label="Avançar 1 frame"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 6v12l8-6z"/></svg></button>
      <button class="icon" id="btnEnd" aria-label="Ir para o fim"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17 5h2v14h-2zM15 12L5 5v14z"/></svg></button>
      <input id="zoom" class="zoomsl" type="range" min="0" max="100" value="28" aria-label="Zoom da timeline (até milissegundos)">
    </div>
    <div class="tlscroll" id="tlScroll">
      <div class="tlinner" id="tlInner">
        <div class="ruler" id="ruler"></div>
        <div class="track" id="trClips"></div>
        <div class="track small" id="trTexts"></div>
        <div class="track small" id="trCaps"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>
  <section class="panel">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="pbody" id="panelBody"></div>
  </section>
</div>
<div id="projSheet" class="sheet" hidden><div class="sheetbox" role="dialog" aria-label="Projetos"><div class="sheethead"><h2>Projetos</h2><button class="btn" id="projClose">Fechar</button></div><button class="btn primary wide" id="projNew">+ Novo projeto</button><p class="hint" id="projUsage"></p><div id="projList"></div></div></div>
<input type="file" id="fileIn" accept="video/*" multiple hidden>
<div id="hiddenVideos" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<script src="fx.js"></script>
<script src="export.js"></script>
<script src="captions.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
<script src="project.js"></script>
</body>
</html>
